<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #7028e4, #e206b4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.4s ease;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area i {
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }

        .logo-area h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .upload-box:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .upload-box i {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .upload-box p {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 500;
        }

        #file-input {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .preview-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .loading-element {
            display: none;
            margin: 20px 0;
        }

        .loading-element i {
            font-size: 2rem;
            color: #ffffff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-wrapper {
            display: none;
            text-align: right;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10deg); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-group {
            margin-bottom: 20px;
        }

        .output-group label {
            display: block;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            padding-right: 5px;
        }

        .input-button-flex {
            display: flex;
            gap: 10px;
        }

        .output-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #333333;
            outline: none;
            direction: ltr;
            font-weight: 500;
        }

        .copy-btn {
            background: #7028e4;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #ff758c;
            box-shadow: 0 0 12px rgba(255, 117, 140, 0.4);
        }

        .copy-btn i {
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <h1>imgge</h1>
        </div>

        <div class="upload-box" id="drop-zone">
            <i class="fa-regular fa-images"></i>
            <p>اسحب الصورة هنا أو اضغط للاختيار</p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="loading-element" id="loader">
            <i class="fa-solid fa-spinner"></i>
        </div>

        <div class="preview-container" id="preview-box">
            <div class="preview-card">
                <img id="image-preview" src="" alt="Preview">
            </div>
        </div>

        <div class="results-wrapper" id="results-box">
            
            <div class="output-group">
                <label><i class="fa-solid fa-code"></i> صور المعرض بالكامل html</label>
                <div class="input-button-flex">
                    <input type="text" id="opt-html" class="output-field" readonly>
                    <button class="copy-btn" onclick="copyValue('opt-html', this)"><i class="fa-regular fa-copy"></i> نسخ</button>
                </div>
            </div>

            <div class="output-group">
                <label><i class="fa-solid fa-link"></i> رابط صورة</label>
                <div class="input-button-flex">
                    <input type="text" id="opt-direct" class="output-field" readonly>
                    <button class="copy-btn" onclick="copyValue('opt-direct', this)"><i class="fa-regular fa-copy"></i> نسخ</button>
                </div>
            </div>

            <div class="output-group">
                <label><i class="fa-solid fa-compress"></i> رابط صورة مصغرة</label>
                <div class="input-button-flex">
                    <input type="text" id="opt-thumb" class="output-field" readonly>
                    <button class="copy-btn" onclick="copyValue('opt-thumb', this)"><i class="fa-regular fa-copy"></i> نسخ</button>
                </div>
            </div>

            <div class="output-group">
                <label><i class="fa-solid fa-expand"></i> رابط صورة مكبرة</label>
                <div class="input-button-flex">
                    <input type="text" id="opt-large" class="output-field" readonly>
                    <button class="copy-btn" onclick="copyValue('opt-large', this)"><i class="fa-regular fa-copy"></i> نسخ</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const previewBox = document.getElementById('preview-box');
        const imagePreview = document.getElementById('image-preview');
        const resultsBox = document.getElementById('results-box');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ffffff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.4)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.4)';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                previewBox.style.display = 'block';
            }
            reader.readAsDataURL(file);

            uploadImage(file);
        }

        function uploadImage(file) {
            loader.style.display = 'block';
            resultsBox.style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            fetch('https://api.imgbb.com/1/upload?key=6697b0a84518bc2561937ffb5f00e5bc', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                loader.style.display = 'none';
                if (result.success) {
                    const data = result.data;
                    
                    document.getElementById('opt-html').value = `<img src="${data.url}" alt="${data.title}" border="0">`;
                    document.getElementById('opt-direct').value = data.url;
                    document.getElementById('opt-thumb').value = data.thumb ? data.thumb.url : data.url;
                    document.getElementById('opt-large').value = data.medium ? data.medium.url : data.url;

                    resultsBox.style.display = 'block';
                }
            })
            .catch(() => {
                loader.style.display = 'none';
            });
        }

        function copyValue(id, btn) {
            const input = document.getElementById(id);
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);

            const origContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> تم';
            setTimeout(() => {
                btn.innerHTML = origContent;
            }, 2000);
        }
    </script>
</body>
</html>
